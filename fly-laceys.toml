# fly.toml app configuration file for laceys-assistant
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
app = 'laceys-assistant'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile.laceys'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512